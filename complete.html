<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- Google tag (gtag.js) -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신청 완료 - 제이오토</title>
    <style>
        @font-face {
            font-family: 'Paperlogy';
            src: url('font/Paperlogy-4Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Paperlogy';
            src: url('font/Paperlogy-5Medium.ttf') format('truetype');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'Paperlogy';
            src: url('font/Paperlogy-6SemiBold.ttf') format('truetype');
            font-weight: 600;
            font-style: normal;
        }
        @font-face {
            font-family: 'Paperlogy';
            src: url('font/Paperlogy-7Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Paperlogy', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(165deg, #f8f9fc 0%, #eef1f7 50%, #f5f6fa 100%);
            padding: 24px;
            color: #1a1d29;
        }

        .complete-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .complete-card {
            background: #fff;
            border-radius: 20px;
            padding: 48px 40px 40px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0, 42, 252, 0.06), 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 42, 252, 0.06);
            position: relative;
            overflow: hidden;
        }

        /* 상단 포인트 라인 */
        .complete-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #0042fc, transparent);
            border-radius: 0 0 3px 3px;
        }

        .complete-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, rgba(0, 66, 252, 0.08) 0%, rgba(0, 66, 252, 0.04) 100%);
            border-radius: 50%;
            animation: fadeScale 0.5s ease;
        }
        .complete-icon svg {
            flex-shrink: 0;
        }
        @keyframes fadeScale {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .complete-title {
            font-family: 'Paperlogy', sans-serif;
            font-weight: 700;
            font-size: 26px;
            letter-spacing: -0.6px;
            color: #0f1428;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .complete-desc {
            font-family: 'Paperlogy', sans-serif;
            font-weight: 400;
            font-size: 15px;
            line-height: 1.75;
            color: #5c6178;
            margin-bottom: 36px;
            letter-spacing: -0.2px;
        }

        .complete-btn {
            display: block;
            width: 100%;
            padding: 16px 32px;
            font-family: 'Paperlogy', sans-serif;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: -0.3px;
            color: #fff;
            background: linear-gradient(135deg, #0042fc 0%, #0038d4 100%);
            border: none;
            border-radius: 12px;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: box-shadow 0.25s ease, transform 0.2s ease;
            box-shadow: 0 4px 16px rgba(0, 66, 252, 0.25);
        }
        .complete-btn:hover {
            box-shadow: 0 6px 24px rgba(0, 66, 252, 0.35);
            transform: translateY(-1px);
        }
        .complete-btn:active {
            transform: translateY(0);
        }

        .complete-footer {
            margin-top: 24px;
            font-family: 'Paperlogy', sans-serif;
            font-weight: 400;
            font-size: 13px;
            color: #9ca3b8;
            letter-spacing: -0.1px;
        }
    </style>
</head>
<body>
    <div class="complete-wrapper">
        <div class="complete-card">
            <div class="complete-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="#0042fc" stroke-width="2" fill="none"/>
                    <path d="M8 12l2 2 4-4" stroke="#0042fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1 class="complete-title">신청 완료</h1>
            <p class="complete-desc">문의가 성공적으로 접수되었습니다.<br>빠른 시일 내에 연락드리겠습니다.</p>
            <a href="index.html" class="complete-btn">확인</a>
        </div>
        <p class="complete-footer">제이오토 · 장기렌트 리스 전문</p>
    </div>
</body>
</html>
